<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Currency Converter app preview</title>
  <desc id="desc">Dark currency conversion interface with an amount, currency pair, swap control, and reference rate result.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171717"/><stop offset="1" stop-color="#080808"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111"/><stop offset="1" stop-color="#090909"/></linearGradient>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#background)"/>
  <circle cx="1030" cy="130" r="180" fill="#fff" opacity=".025"/>
  <text x="86" y="118" fill="#858585" font-family="Verdana, sans-serif" font-size="17" font-weight="700" letter-spacing="3">CURRENCY CONVERTER</text>
  <text x="86" y="186" fill="#fff" font-family="Verdana, sans-serif" font-size="42" font-weight="700">Convert currencies</text>
  <text x="86" y="230" fill="#a3a3a3" font-family="Verdana, sans-serif" font-size="19">Use the latest available reference rates.</text>
  <rect x="72" y="278" width="1056" height="400" rx="22" fill="url(#card)" stroke="#292929" stroke-width="2"/>
  <text x="112" y="340" fill="#a3a3a3" font-family="Verdana, sans-serif" font-size="17">AMOUNT</text>
  <rect x="108" y="365" width="984" height="86" rx="12" fill="#070707" stroke="#292929" stroke-width="2"/>
  <text x="138" y="421" fill="#777" font-family="Verdana, sans-serif" font-size="23">USD</text>
  <text x="245" y="421" fill="#f7f7f7" font-family="Verdana, sans-serif" font-size="34" font-weight="700">1,000.00</text>
  <rect x="108" y="485" width="422" height="104" rx="14" fill="#0d0d0d" stroke="#292929" stroke-width="2"/>
  <rect x="670" y="485" width="422" height="104" rx="14" fill="#0d0d0d" stroke="#292929" stroke-width="2"/>
  <text x="140" y="524" fill="#777" font-family="Verdana, sans-serif" font-size="15">FROM</text>
  <text x="140" y="565" fill="#fff" font-family="Verdana, sans-serif" font-size="24" font-weight="700">USD · US Dollar</text>
  <text x="702" y="524" fill="#777" font-family="Verdana, sans-serif" font-size="15">TO</text>
  <text x="702" y="565" fill="#fff" font-family="Verdana, sans-serif" font-size="24" font-weight="700">INR · Indian Rupee</text>
  <circle cx="600" cy="537" r="28" fill="#fff"/>
  <path d="M587 532h23m-6-7 7 7-7 7m-4 6h-23m6-7-7 7 7 7" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="112" y="625" fill="#777" font-family="Verdana, sans-serif" font-size="15">CONVERTED AMOUNT</text>
  <text x="1088" y="640" text-anchor="end" fill="#fff" font-family="Verdana, sans-serif" font-size="37" font-weight="700">₹83,500.00 <tspan fill="#888" font-size="20">INR</tspan></text>
</svg>